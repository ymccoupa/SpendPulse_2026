<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spend Pulse Demo Aug 26</title>
<meta name="description" content="Responsive HTML recreation of the Spend Pulse Figma prototype (Demo Spend Pulse, Aug 26), including its full interaction flow.">
<!-- Fonts are vendored locally (Nunito Sans, Open Sans, Material Symbols) so the
     prototype renders identically offline. -->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <!-- Secondary navigation. A screen that has one (Sourcing does) fills this
       slot: the band runs the full width of the window, so it sits outside
       `.page`, whose padding and 1600px cap would inset it. -->
  <div id="subnav"></div>

  <main class="page" id="screen" tabindex="-1"></main>
</div>

<div id="overlay-layer" aria-live="polite"></div>
<!-- The Navi chat sits above the overlays it is handed off from and below the
     tooltips and toasts, which have to stay reachable over everything. -->
<div id="navi-layer" aria-live="polite"></div>
<div id="tip-layer"></div>
<div id="toast-layer"></div>

<script src="app.js"></script>
</body>
</html>
